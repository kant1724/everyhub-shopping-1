<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>주문완료</title>
    <link rel="stylesheet" href="/static/lib/fontawesome-pro/css/all.css">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
    <link href="/static/css/common/base.css" rel="stylesheet">
    <link href="/static/css/purchase/purchase_complete.css" rel="stylesheet">
</head>

<body>
    <div id="complete_app" class="done" v-cloak>
        <app-header :user-no="userNo" :admin-yn="adminYn"></app-header>

        <div class="done-shell">
            <div class="done-card">
                <div class="done-icon"><i class="fal fa-check"></i></div>

                <h1 class="done-title">주문이 완료되었습니다</h1>
                <p class="done-sub">아래 계좌로 입금해 주시면 발송이 시작됩니다.</p>

                <div class="done-account">
                    <dl class="done-account-row">
                        <dt>입금 계좌</dt>
                        <dd id="seller_acno">[[ acno ]]</dd>
                    </dl>
                    <dl class="done-account-row">
                        <dt>예금주</dt>
                        <dd id="seller_deposit_person_nm">[[ depositPersonNm ]]</dd>
                    </dl>
                </div>

                <p class="done-note">입금자명이 주문 시 입력한 이름과 다르면 확인이 늦어질 수 있습니다.</p>

                <div class="done-actions">
                    <button type="button" class="done-btn done-btn-ghost re-order" @click="reorder">재주문하기</button>
                    <button type="button" class="done-btn done-btn-primary go-main" @click="goMain">메인으로</button>
                </div>
            </div>
        </div>

        <app-footer></app-footer>
    </div>

    <input id="items" type="hidden" value="{{items}}">
    <input type="hidden" id="user_no" value="{{userNo}}">
    <input type="hidden" id="admin_yn" value="{{adminYn}}">

    <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
    <script src="/static/js/common/utils.js"></script>
    <script src="/static/js/component/vue-layout.js"></script>
    <script src="/static/js/purchase/purchase_complete.js"></script>
</body>

</html>
