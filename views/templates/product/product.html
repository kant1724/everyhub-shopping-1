<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>상품정보</title>
    <link rel="stylesheet" href="/static/lib/fontawesome-pro/css/all.css">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
    <link href="/static/lib/swiper/swiper.css" rel="stylesheet">
    <link href="/static/css/common/base.css" rel="stylesheet">
    <link href="/static/css/product/product.css" rel="stylesheet">
</head>

<body>
    <div id="product_app" class="pdp" v-cloak>
        <app-header :user-no="userNo" :admin-yn="adminYn"></app-header>

        <div class="pdp-shell">
            <div class="pdp-top">
                <div class="pdp-gallery">
                    <div class="swiper-container product-gallery" v-if="images.length > 0">
                        <div class="swiper-wrapper">
                            <div class="swiper-slide" v-for="(img, i) in images" :key="i">
                                <img :src="img" :alt="item ? item.itemNm : ''">
                            </div>
                        </div>
                        <div class="swiper-pagination"></div>
                    </div>
                    <div class="pdp-gallery-empty" v-else></div>
                </div>

                <div class="pdp-info">
                    <div class="pdp-name-row">
                        <h1 class="pdp-name">[[ item ? item.itemNm : '' ]]</h1>
                        <span class="pdp-badge" v-if="statusLabel">[[ statusLabel ]]</span>
                    </div>

                    <div class="pdp-price">[[ itemPriceText ]]</div>
                    <div class="pdp-shipping">배송비 [[ shippingFeeText ]]</div>

                    <p class="pdp-desc" v-html="descHtml"></p>

                    <div class="pdp-field">
                        <label class="pdp-label" for="item_option">옵션</label>
                        <select id="item_option" class="pdp-select" v-model="selectedOptionNo">
                            <option v-for="o in usableOptions" :key="o.optionNo" :value="o.optionNo">[[ o.optionNm ]]</option>
                        </select>
                    </div>

                    <div class="pdp-field">
                        <span class="pdp-label">수량</span>
                        <div class="qty-stepper">
                            <button type="button" @click="decrease" :disabled="qty <= 1" aria-label="수량 감소">
                                <i class="fal fa-minus"></i>
                            </button>
                            <span class="qty-value">[[ qty ]]</span>
                            <button type="button" @click="increase" aria-label="수량 증가">
                                <i class="fal fa-plus"></i>
                            </button>
                        </div>
                    </div>

                    <div class="pdp-origin">원산지 <strong>국내산</strong></div>

                    <div class="pdp-total">
                        <span>총 상품금액</span>
                        <strong>[[ totalPriceText ]]</strong>
                    </div>

                    <div class="pdp-actions">
                        <button type="button" id="add_cart" class="pdp-btn pdp-btn-ghost" :disabled="!canBuy" @click="addCart">
                            장바구니
                        </button>
                        <button type="button" id="order_now" class="pdp-btn pdp-btn-primary" :disabled="!canBuy" @click="orderNow">
                            [[ statusLabel ? statusLabel : '바로 주문하기' ]]
                        </button>
                    </div>
                </div>
            </div>

            <div class="pdp-tabs">
                <button type="button" id="product_review" class="pdp-tab" :class="{ 'is-active': tab === 'review' }" @click="tab = 'review'">
                    제품후기 <span class="pdp-tab-count">[[ reviews.length ]]</span>
                </button>
                <button type="button" id="qna" class="pdp-tab" :class="{ 'is-active': tab === 'qna' }" @click="tab = 'qna'">
                    Q&amp;A <span class="pdp-tab-count">[[ qnas.length ]]</span>
                </button>
            </div>

            <div v-show="tab === 'review'" class="pdp-panel">
                <div v-if="reviews.length === 0" class="pdp-empty">등록된 후기가 없습니다.</div>
                <ul v-else class="pdp-list">
                    <li v-for="r in pagedReviews" :key="r.reviewNo" class="pdp-list-item">
                        <button type="button" class="pdp-list-head" @click="toggleReview(r.reviewNo)">
                            <span class="pdp-list-stars">
                                <i class="fas fa-star" v-for="n in stars(r.star)" :key="n"></i>
                            </span>
                            <span class="pdp-list-subject">[[ r.subject ]]</span>
                            <span class="pdp-list-date">[[ r.reviewDate ]]</span>
                        </button>
                        <div class="pdp-list-body" v-show="openedReviewNo === r.reviewNo">[[ r.content ]]</div>
                    </li>
                </ul>
                <div class="pdp-pager" v-if="reviews.length > 0">
                    <button type="button" @click="goReviewPage(reviewPage - 1)" :disabled="reviewPage === 0">&laquo;</button>
                    <button type="button" v-for="n in reviewPageCount" :key="n"
                            :class="{ 'is-active': reviewPage === n - 1 }" @click="goReviewPage(n - 1)">[[ n ]]</button>
                    <button type="button" @click="goReviewPage(reviewPage + 1)"
                            :disabled="reviewPage + 1 >= reviewPageCount && !reviewHasMore">&raquo;</button>
                </div>
            </div>

            <div v-show="tab === 'qna'" class="pdp-panel">
                <div class="pdp-panel-actions">
                    <button type="button" id="write_qna" class="pdp-btn-small" @click="openQnaModal">질문하기</button>
                </div>
                <div v-if="qnas.length === 0" class="pdp-empty">등록된 질문이 없습니다.</div>
                <ul v-else class="pdp-list">
                    <li v-for="q in pagedQnas" :key="q.qnaNo" class="pdp-list-item">
                        <button type="button" class="pdp-list-head" @click="toggleQna(q.qnaNo)">
                            <span class="pdp-list-subject">[[ q.subject ]]</span>
                            <span class="pdp-list-date">[[ q.qnaDate ]]</span>
                        </button>
                        <div class="pdp-list-body" v-show="openedQnaNo === q.qnaNo">
                            <p class="pdp-qna-question">[[ q.content ]]</p>
                            <div class="pdp-reply" v-for="(rep, i) in (qnaReplies[q.qnaNo] || [])" :key="i">
                                <div class="pdp-reply-label">답변</div>
                                <div class="pdp-reply-text">[[ rep.content ]]</div>
                            </div>
                            <div class="pdp-reply-form" v-if="isAdmin">
                                <textarea v-model="replyText" rows="3" placeholder="답변을 입력하세요"></textarea>
                                <button type="button" class="pdp-btn-small" @click="submitReply(q.qnaNo)">답글 등록</button>
                            </div>
                        </div>
                    </li>
                </ul>
                <div class="pdp-pager" v-if="qnas.length > 0">
                    <button type="button" @click="goQnaPage(qnaPage - 1)" :disabled="qnaPage === 0">&laquo;</button>
                    <button type="button" v-for="n in qnaPageCount" :key="n"
                            :class="{ 'is-active': qnaPage === n - 1 }" @click="goQnaPage(n - 1)">[[ n ]]</button>
                    <button type="button" @click="goQnaPage(qnaPage + 1)"
                            :disabled="qnaPage + 1 >= qnaPageCount && !qnaHasMore">&raquo;</button>
                </div>
            </div>
        </div>

        <!-- 질문 작성 모달 (부트스트랩 모달 대체) -->
        <transition name="modal-fade">
            <div class="gd-modal-backdrop" v-if="qnaModalOpen" @click.self="qnaModalOpen = false">
                <div class="gd-modal" role="dialog" aria-modal="true">
                    <div class="gd-modal-body">
                        <h2 class="gd-modal-title">Q&amp;A 질문작성</h2>
                        <label class="pdp-label" for="qna_subject_modal">제목</label>
                        <input id="qna_subject_modal" type="text" class="pdp-input" v-model="qnaForm.subject">
                        <label class="pdp-label pdp-label-mt" for="qna_content_modal">내용</label>
                        <textarea id="qna_content_modal" class="pdp-input pdp-textarea" v-model="qnaForm.content"></textarea>
                    </div>
                    <div class="gd-modal-footer">
                        <button type="button" class="gd-btn" @click="qnaModalOpen = false">닫기</button>
                        <button type="button" id="write_qna_btn" class="gd-btn gd-btn-primary" @click="submitQna">작성</button>
                    </div>
                </div>
            </div>
        </transition>

        <transition name="toast">
            <div class="pdp-toast" v-if="toast">[[ toast ]]</div>
        </transition>

        <app-footer></app-footer>
    </div>

    <input type="hidden" id="item_no" value="{{itemNo}}">
    <input type="hidden" id="user_no" value="{{userNo}}">
    <input type="hidden" id="admin_yn" value="{{adminYn}}">

    <script src="/static/lib/swiper/swiper.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
    <script src="/static/js/common/utils.js"></script>
    <script src="/static/js/component/vue-layout.js"></script>
    <script src="/static/js/product/product.js"></script>
</body>

</html>
