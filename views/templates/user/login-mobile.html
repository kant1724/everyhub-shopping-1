<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인</title>
    <link rel="stylesheet" href="/static/lib/fontawesome-pro/css/all.css">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
    <link href="/static/css/common/base.css" rel="stylesheet">
    <link href="/static/css/user/login.css" rel="stylesheet">
</head>

<body>
    <div id="login_app" class="auth" v-cloak>
        <div class="auth-shell">
            <a class="auth-logo" href="/">
                <img src="/static/res/gandeurak_logo.jpg" alt="간드락농원">
            </a>

            <div class="auth-card">
                <h1 class="auth-title">로그인</h1>

                <input type="tel" class="auth-input" placeholder="휴대폰번호 (- 제외)"
                       v-model="telno" @keyup.enter="login" id="telno">
                <input type="password" class="auth-input" placeholder="비밀번호" autocomplete="current-password"
                       v-model="password" @keyup.enter="login" id="password">

                <button type="button" id="login" class="auth-btn auth-btn-primary" @click="login" :disabled="submitting">
                    [[ submitting ? '로그인 중...' : '로그인' ]]
                </button>
                <button type="button" id="sign_up" class="auth-btn auth-btn-ghost" @click="goSignUp">회원가입</button>

                <button type="button" id="get_password" class="auth-link" @click="goFindPassword">비밀번호 찾기</button>
            </div>
        </div>

        <input type="hidden" id="user_no" value="{{userNo}}">
        <input type="hidden" id="admin_yn" value="{{adminYn}}">
        <input type="hidden" id="gubun" value="{{gubun}}">
        <input type="hidden" id="param" value="{{param}}">
    </div>

    <script src="/static/lib/sha256/sha256.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
    <script src="/static/js/common/utils.js"></script>
    <script src="/static/js/component/vue-layout.js"></script>
    <script src="/static/js/user/login.js"></script>
</body>

</html>
