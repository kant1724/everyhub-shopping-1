<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>비밀번호 찾기</title>
    <link rel="stylesheet" href="/static/lib/fontawesome-pro/css/all.css">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
    <link href="/static/css/common/base.css" rel="stylesheet">
    <link href="/static/css/user/login.css" rel="stylesheet">
</head>

<body>
    <div id="find_app" class="auth" v-cloak>
        <div class="auth-shell">
            <a class="auth-logo" href="/">
                <img src="/static/res/gandeurak_logo.jpg" alt="간드락농원">
            </a>

            <div class="auth-card">
                <h1 class="auth-title">비밀번호 찾기</h1>

                <ol class="auth-steps">
                    <li :class="{ 'is-on': step >= 1 }">번호 확인</li>
                    <li :class="{ 'is-on': step >= 2 }">인증</li>
                    <li :class="{ 'is-on': step >= 3 }">새 비밀번호</li>
                </ol>

                <input type="tel" id="telno" class="auth-input" placeholder="휴대폰번호 (- 제외)"
                       v-model="telno" :readonly="step > 1" @keyup.enter="sendCode">

                <button type="button" id="get_certification_code" class="auth-btn auth-btn-primary"
                        v-if="step === 1" @click="sendCode" :disabled="busy">
                    [[ busy ? '전송 중...' : '인증번호 받기' ]]
                </button>

                <template v-if="step === 2">
                    <input type="tel" id="certification_code" class="auth-input" placeholder="인증번호 6자리"
                           v-model="certificationCode" @keyup.enter="confirmCode">
                    <p class="auth-hint">인증번호는 5분간 유효합니다.</p>
                    <button type="button" id="confirm_certification_code" class="auth-btn auth-btn-primary"
                            @click="confirmCode" :disabled="busy">인증 확인</button>
                </template>

                <template v-if="step === 3">
                    <input type="password" id="password" class="auth-input" placeholder="새 비밀번호"
                           autocomplete="new-password" v-model="password">
                    <input type="password" id="password_confirm" class="auth-input" placeholder="새 비밀번호 확인"
                           autocomplete="new-password" v-model="passwordConfirm" @keyup.enter="changePassword">
                    <button type="button" id="modify_password" class="auth-btn auth-btn-primary"
                            @click="changePassword" :disabled="busy">변경 완료</button>
                </template>
            </div>
        </div>

        <input type="hidden" id="user_no" value="{{userNo}}">
        <input type="hidden" id="admin_yn" value="{{adminYn}}">
    </div>

    <script src="/static/lib/sha256/sha256.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
    <script src="/static/js/common/utils.js"></script>
    <script src="/static/js/component/vue-layout.js"></script>
    <script src="/static/js/user/get_password.js"></script>
</body>

</html>
