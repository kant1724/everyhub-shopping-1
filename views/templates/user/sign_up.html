<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원가입</title>
    <link rel="stylesheet" href="/static/lib/fontawesome-pro/css/all.css">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
    <link href="/static/css/common/base.css" rel="stylesheet">
    <link href="/static/css/user/sign_up.css" rel="stylesheet">
</head>

<body>
    <div id="signup_app" class="auth auth-wide" v-cloak>
        <app-header :user-no="'0'" admin-yn="N"></app-header>

        <div class="auth-shell auth-shell-wide">
            <h1 class="auth-page-title">회원가입</h1>

            <section class="auth-card auth-card-form">
                <div class="auth-field">
                    <span class="auth-label">휴대폰번호</span>
                    <div class="auth-tel">
                        <input id="telno_1" type="tel" class="gd-input" maxlength="3" v-model="form.telno1"
                               ref="t1" :readonly="telnoVerified"
                               @input="advance($event, 3, 't2'); onTelnoChanged()">
                        <span>-</span>
                        <input id="telno_2" type="tel" class="gd-input" maxlength="4" v-model="form.telno2"
                               ref="t2" :readonly="telnoVerified"
                               @input="advance($event, 4, 't3'); onTelnoChanged()">
                        <span>-</span>
                        <input id="telno_3" type="tel" class="gd-input" maxlength="4" v-model="form.telno3"
                               ref="t3" :readonly="telnoVerified" @input="onTelnoChanged">
                        <button type="button" id="send_sign_up_code" class="auth-ghost-btn"
                                @click="sendCode" :disabled="busy || telnoVerified || resendIn > 0">
                            [[ sendBtnLabel ]]
                        </button>
                    </div>
                </div>
                <p class="auth-dup" :class="{ 'is-ok': telnoVerified }">
                    [[ certMessage ]]
                </p>

                <!-- 인증번호 입력: 발송 후 인증이 끝나기 전까지만 보인다 -->
                <div class="auth-field" v-if="codeSent && !telnoVerified">
                    <label class="auth-label" for="certification_code">인증번호</label>
                    <div class="auth-tel">
                        <input id="certification_code" type="tel" inputmode="numeric" maxlength="6"
                               class="gd-input auth-cert-input" placeholder="6자리" ref="code"
                               v-model="certificationCode" @keyup.enter="confirmCode">
                        <span class="auth-cert-timer" :class="{ 'is-urgent': certUrgent }">[[ timeLeftText ]]</span>
                        <button type="button" id="confirm_sign_up_code" class="auth-ghost-btn"
                                @click="confirmCode" :disabled="busy">인증확인</button>
                    </div>
                </div>

                <div class="auth-field">
                    <label class="auth-label" for="password">비밀번호</label>
                    <input id="password" type="password" class="gd-input" autocomplete="new-password" v-model="form.password">
                </div>

                <div class="auth-field">
                    <label class="auth-label" for="password_confirm">비밀번호 확인</label>
                    <input id="password_confirm" type="password" class="gd-input" autocomplete="new-password" v-model="form.passwordConfirm">
                </div>

                <div class="auth-field">
                    <label class="auth-label" for="user_nm">이름</label>
                    <input id="user_nm" type="text" class="gd-input" v-model="form.userNm">
                </div>

                <div class="auth-field">
                    <span class="auth-label">성별</span>
                    <div class="auth-radios">
                        <label class="auth-radio"><input type="radio" id="gender_male" value="M" v-model="form.gender"><span>남</span></label>
                        <label class="auth-radio"><input type="radio" id="gender_female" value="F" v-model="form.gender"><span>여</span></label>
                    </div>
                </div>

                <div class="auth-field">
                    <span class="auth-label">생년월일</span>
                    <div class="auth-birth">
                        <input id="date_of_birth_y" type="text" inputmode="numeric" maxlength="4" class="gd-input" placeholder="1980" v-model="form.dateOfBirthY"><span>년</span>
                        <input id="date_of_birth_m" type="text" inputmode="numeric" maxlength="2" class="gd-input" placeholder="01" v-model="form.dateOfBirthM"><span>월</span>
                        <input id="date_of_birth_d" type="text" inputmode="numeric" maxlength="2" class="gd-input" placeholder="01" v-model="form.dateOfBirthD"><span>일</span>
                    </div>
                </div>

                <div class="auth-field auth-field-block">
                    <span class="auth-label">주소</span>
                    <div class="auth-address">
                        <div class="auth-address-row">
                            <input id="zip_no" type="text" class="gd-input auth-zip" :value="form.zipNo" placeholder="우편번호" readonly>
                            <button type="button" id="search_address" class="auth-ghost-btn" @click="addressOpen = true">주소검색</button>
                        </div>
                        <input id="address_main" type="text" class="gd-input" :value="form.addressMain" placeholder="기본주소" readonly>
                        <input id="address_detail" type="text" class="gd-input" v-model="form.addressDetail" placeholder="상세주소">
                    </div>
                </div>

                <label class="auth-agree">
                    <input type="checkbox" id="agree_policy" v-model="form.agree">
                    <span>개인정보처리방침에 동의합니다.</span>
                    <a href="/personal_information_policy" target="_blank" class="auth-agree-link">전문보기</a>
                </label>

                <button type="button" id="go_signing_up_btn" class="auth-btn auth-btn-primary"
                        @click="signUp" :disabled="submitting">
                    [[ submitting ? '가입 중...' : '가입하기' ]]
                </button>
            </section>
        </div>

        <transition name="modal-fade">
            <address-search v-if="addressOpen" @close="addressOpen = false" @select="onAddressSelected"></address-search>
        </transition>

        <input type="hidden" id="user_no" value="{{userNo}}">
        <input type="hidden" id="admin_yn" value="{{adminYn}}">

        <app-footer></app-footer>
    </div>

    <script src="/static/lib/sha256/sha256.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
    <script src="/static/js/common/utils.js"></script>
    <script src="/static/js/component/vue-layout.js"></script>
    <script src="/static/js/user/sign_up.js"></script>
</body>

</html>
