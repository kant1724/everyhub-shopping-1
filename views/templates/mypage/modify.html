<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>주문내역 수정</title>
    <link rel="stylesheet" href="/static/lib/fontawesome-pro/css/all.css">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
    <link href="/static/css/common/base.css" rel="stylesheet">
    <link href="/static/css/purchase/purchase.css" rel="stylesheet">
    <link href="/static/css/mypage/modify.css" rel="stylesheet">
</head>

<body>
    <div id="modify_app" class="chk" v-cloak>
        <app-header :user-no="userNo" :admin-yn="adminYn"></app-header>

        <div class="chk-shell">
            <button type="button" class="mod-back" @click="goBack">
                <i class="far fa-angle-left"></i> 목록으로
            </button>

            <h1 class="chk-title">주문내역 수정</h1>
            <p class="mod-order-no">주문번호 [[ orderNo ]]</p>

            <p v-if="loading" class="mod-loading">불러오는 중...</p>

            <div v-else class="chk-layout">
                <div class="chk-main">
                    <!-- 주문자 -->
                    <section class="chk-card">
                        <h2 class="chk-card-title">주문자 정보</h2>

                        <div class="chk-field">
                            <label class="chk-label" for="order_person_nm">주문자명</label>
                            <input id="order_person_nm" type="text" class="chk-input"
                                   v-model="form.orderPersonNm" @change="onOrderInfoChanged">
                        </div>

                        <div class="chk-field">
                            <span class="chk-label">휴대폰 번호</span>
                            <div class="chk-tel">
                                <input id="order_telno_1" type="tel" class="chk-input chk-input-tel" maxlength="3"
                                       v-model="form.orderTelno1" ref="ot1"
                                       @input="advance($event, 3, 'ot2')" @change="onOrderInfoChanged">
                                <span class="chk-tel-sep">-</span>
                                <input id="order_telno_2" type="tel" class="chk-input chk-input-tel" maxlength="4"
                                       v-model="form.orderTelno2" ref="ot2"
                                       @input="advance($event, 4, 'ot3')" @change="onOrderInfoChanged">
                                <span class="chk-tel-sep">-</span>
                                <input id="order_telno_3" type="tel" class="chk-input chk-input-tel" maxlength="4"
                                       v-model="form.orderTelno3" ref="ot3" @change="onOrderInfoChanged">
                            </div>
                        </div>

                        <div class="chk-field chk-field-block">
                            <label class="chk-label" for="order_remarks">주문메모</label>
                            <textarea id="order_remarks" class="chk-input chk-textarea" v-model="form.orderRemarks"></textarea>
                        </div>
                    </section>

                    <!-- 보내는분 -->
                    <section class="chk-card">
                        <div class="chk-card-head">
                            <h2 class="chk-card-title">보내는 분</h2>
                            <label class="chk-check mod-toggle">
                                <input type="checkbox" id="has_sender" v-model="hasSender">
                                <span>보내는분 따로 입력</span>
                            </label>
                        </div>

                        <p class="chk-hint" v-if="!hasSender">체크를 해제하면 보내는분 정보는 저장되지 않습니다.</p>

                        <template v-if="hasSender">
                            <label class="chk-check">
                                <input type="checkbox" :checked="form.senderSame" @change="onSenderSame">
                                <span>주문자 정보와 동일</span>
                            </label>

                            <div class="chk-field">
                                <label class="chk-label" for="send_person_nm">보내는분</label>
                                <input id="send_person_nm" type="text" class="chk-input" v-model="form.sendPersonNm">
                            </div>

                            <div class="chk-field">
                                <span class="chk-label">휴대폰 번호</span>
                                <div class="chk-tel">
                                    <input id="send_telno_1" type="tel" class="chk-input chk-input-tel" maxlength="3"
                                           v-model="form.sendTelno1" ref="st1" @input="advance($event, 3, 'st2')">
                                    <span class="chk-tel-sep">-</span>
                                    <input id="send_telno_2" type="tel" class="chk-input chk-input-tel" maxlength="4"
                                           v-model="form.sendTelno2" ref="st2" @input="advance($event, 4, 'st3')">
                                    <span class="chk-tel-sep">-</span>
                                    <input id="send_telno_3" type="tel" class="chk-input chk-input-tel" maxlength="4"
                                           v-model="form.sendTelno3" ref="st3">
                                </div>
                            </div>

                            <div class="chk-field chk-field-block">
                                <span class="chk-label">주소</span>
                                <div class="chk-address">
                                    <div class="chk-address-row">
                                        <input type="text" class="chk-input chk-input-zip" id="send_zip_no"
                                               :value="form.sendZipNo" placeholder="우편번호" readonly>
                                        <button type="button" id="search_send_address" class="chk-btn-ghost"
                                                @click="openAddress('send')">주소검색</button>
                                    </div>
                                    <input type="text" class="chk-input" id="send_address_main"
                                           :value="form.sendAddressMain" placeholder="기본주소" readonly>
                                    <input type="text" class="chk-input" id="send_address_detail"
                                           v-model="form.sendAddressDetail" placeholder="상세주소">
                                </div>
                            </div>
                        </template>
                    </section>

                    <!-- 받는분 -->
                    <section class="chk-card">
                        <h2 class="chk-card-title">받는 분</h2>

                        <label class="chk-check">
                            <input type="checkbox" :checked="form.receiverSame" @change="onReceiverSame">
                            <span>주문자 정보와 동일</span>
                        </label>

                        <div class="chk-field">
                            <label class="chk-label" for="receive_person_nm">받는분</label>
                            <input id="receive_person_nm" type="text" class="chk-input" v-model="form.receivePersonNm">
                        </div>

                        <div class="chk-field">
                            <span class="chk-label">휴대폰 번호</span>
                            <div class="chk-tel">
                                <input id="receive_telno_1" type="tel" class="chk-input chk-input-tel" maxlength="3"
                                       v-model="form.receiveTelno1" ref="rt1" @input="advance($event, 3, 'rt2')">
                                <span class="chk-tel-sep">-</span>
                                <input id="receive_telno_2" type="tel" class="chk-input chk-input-tel" maxlength="4"
                                       v-model="form.receiveTelno2" ref="rt2" @input="advance($event, 4, 'rt3')">
                                <span class="chk-tel-sep">-</span>
                                <input id="receive_telno_3" type="tel" class="chk-input chk-input-tel" maxlength="4"
                                       v-model="form.receiveTelno3" ref="rt3">
                            </div>
                        </div>

                        <div class="chk-field chk-field-block">
                            <span class="chk-label">주소</span>
                            <div class="chk-address">
                                <div class="chk-address-row">
                                    <input type="text" class="chk-input chk-input-zip" id="receive_zip_no"
                                           :value="form.receiveZipNo" placeholder="우편번호" readonly>
                                    <button type="button" id="search_receive_address" class="chk-btn-ghost"
                                            @click="openAddress('receive')">주소검색</button>
                                </div>
                                <input type="text" class="chk-input" id="receive_address_main"
                                       :value="form.receiveAddressMain" placeholder="기본주소" readonly>
                                <input type="text" class="chk-input" id="receive_address_detail"
                                       v-model="form.receiveAddressDetail" placeholder="상세주소">
                            </div>
                        </div>
                    </section>

                    <!-- 입금 정보 -->
                    <section class="chk-card">
                        <h2 class="chk-card-title">입금 정보</h2>

                        <div class="chk-field">
                            <span class="chk-label">입금자</span>
                            <div class="chk-radios">
                                <label class="chk-radio">
                                    <input type="radio" name="depositWho" :checked="form.depositWho === 'order'"
                                           @change="pickDepositWho('order')"><span>주문자</span>
                                </label>
                                <label class="chk-radio">
                                    <input type="radio" name="depositWho" :checked="form.depositWho === 'send'"
                                           @change="pickDepositWho('send')"><span>보내는분</span>
                                </label>
                                <label class="chk-radio">
                                    <input type="radio" name="depositWho" :checked="form.depositWho === 'receive'"
                                           @change="pickDepositWho('receive')"><span>받는분</span>
                                </label>
                            </div>
                        </div>

                        <div class="chk-field">
                            <label class="chk-label" for="deposit_person_nm">입금자명</label>
                            <input id="deposit_person_nm" type="text" class="chk-input" v-model="form.depositPersonNm">
                        </div>

                        <div class="chk-field chk-field-block">
                            <label class="chk-label" for="deposit_remarks">입금메모</label>
                            <textarea id="deposit_remarks" class="chk-input chk-textarea" v-model="form.depositRemarks"></textarea>
                        </div>
                    </section>
                </div>

                <aside class="chk-summary">
                    <div class="chk-summary-box">
                        <h2 class="chk-summary-title">주문 수정</h2>
                        <p class="mod-note">수정한 내용은 저장 즉시 주문에 반영됩니다.</p>
                        <button type="button" class="chk-pay-btn modify-btn" @click="save" :disabled="submitting">
                            [[ submitting ? '저장 중...' : '수정 저장' ]]
                        </button>
                        <button type="button" class="mod-cancel-btn" @click="goBack">취소</button>
                    </div>
                </aside>
            </div>
        </div>

        <transition name="modal-fade">
            <address-search v-if="addressOpen" @close="addressOpen = false" @select="onAddressSelected"></address-search>
        </transition>

        <app-footer></app-footer>
    </div>

    <input type="hidden" id="user_no" value="{{userNo}}">
    <input type="hidden" id="admin_yn" value="{{adminYn}}">
    <input type="hidden" id="order_no" value="{{orderNo}}">
    <input type="hidden" id="gubun" value="{{gubun}}">

    <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
    <script src="/static/js/common/utils.js"></script>
    <script src="/static/js/component/vue-layout.js"></script>
    <script src="/static/js/mypage/modify.js"></script>
</body>

</html>
