<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>갤러리 관리</title>
    <link rel="stylesheet" href="/static/lib/fontawesome-pro/css/all.css">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
    <link href="/static/css/common/base.css" rel="stylesheet">
    <link href="/static/css/admin/admin.css" rel="stylesheet">
</head>

<body>
    <div id="gallery_app" class="adm" v-cloak>
        <app-header :user-no="userNo" :admin-yn="adminYn"></app-header>

        <div class="adm-shell">
            <div class="adm-head">
                <div>
                    <h1 class="adm-title">갤러리 관리</h1>
                    <p class="adm-sub">메인 페이지 갤러리에 노출되는 사진과 설명입니다</p>
                </div>
                <div class="adm-actions">
                    <button type="button" class="adm-btn adm-btn-primary" id="gallery_modify_btn"
                            @click="save" :disabled="saving">
                        [[ saving ? '저장 중...' : '저장' ]]
                    </button>
                </div>
            </div>

            <p v-if="loading" class="adm-empty">불러오는 중...</p>

            <section v-else class="adm-card">
                <p class="adm-note">사진을 새로 고르지 않으면 기존 사진이 그대로 유지됩니다. 삭제를 누른 슬롯만 비워집니다.</p>
                <div class="adm-images">
                    <div class="adm-image-slot" v-for="s in slots" :key="s.n">
                        <div class="adm-image-label">사진 [[ s.n ]]</div>
                        <img v-if="shownImage(s)" :src="shownImage(s)" :alt="'갤러리 ' + s.n">
                        <div v-else class="adm-image-empty"><i class="fal fa-image"></i></div>
                        <input :id="'gallery_image_' + s.n" type="file" accept="image/*" @change="onPick(s, $event)">
                        <textarea class="gd-input adm-gallery-desc" :id="'image_desc_' + s.n"
                                  v-model="s.desc" placeholder="사진 설명"></textarea>
                        <button type="button" class="adm-link adm-link-danger adm-image-remove"
                                v-if="shownImage(s)" @click="clearSlot(s)">이미지 삭제</button>
                    </div>
                </div>
            </section>
        </div>

        <app-footer></app-footer>
    </div>

    <input type="hidden" id="user_no" value="{{userNo}}">
    <input type="hidden" id="admin_yn" value="{{adminYn}}">

    <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
    <script src="/static/js/common/utils.js"></script>
    <script src="/static/js/component/vue-layout.js"></script>
    <script src="/static/js/admin/gallery_manager/gallery_manager.js"></script>
</body>

</html>
