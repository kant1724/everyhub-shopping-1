<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>배송비 관리</title>
    <link rel="stylesheet" href="/static/lib/fontawesome-pro/css/all.css">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
    <link href="/static/css/common/base.css" rel="stylesheet">
    <link href="/static/css/admin/admin.css" rel="stylesheet">
</head>

<body>
    <div id="delivery_app" class="adm" v-cloak>
        <app-header :user-no="userNo" :admin-yn="adminYn"></app-header>

        <div class="adm-shell">
            <div class="adm-head">
                <div>
                    <h1 class="adm-title">배송비 관리</h1>
                    <p class="adm-sub">우편번호별 추가 배송비 [[ rows.length ]]건</p>
                </div>
                <div class="adm-actions">
                    <button type="button" class="adm-btn adm-btn-primary new-shipping-info-btn" @click="openNew">배송비 등록</button>
                </div>
            </div>

            <p v-if="loading && rows.length === 0" class="adm-empty">불러오는 중...</p>
            <p v-else-if="rows.length === 0" class="adm-empty">등록된 배송정보가 없습니다.</p>

            <div v-else class="adm-table-wrap">
                <table class="adm-table">
                    <thead>
                        <tr>
                            <th>번호</th><th>우편번호</th><th>주소1</th><th>주소2</th><th>주소3</th>
                            <th>포함키워드</th><th>추가배송비</th><th class="adm-table-center">관리</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="r in rows" :key="r.shippingInfoNo">
                            <td>[[ r.shippingInfoNo ]]</td>
                            <td>[[ r.zipNo ]]</td>
                            <td>[[ r.addr1 ]]</td>
                            <td>[[ r.addr2 ]]</td>
                            <td>[[ r.addr3 ]]</td>
                            <td>[[ r.includingKeyword ]]</td>
                            <td>[[ won(r.shippingFee) ]]원</td>
                            <td class="adm-table-center">
                                <button type="button" class="adm-link" @click="openEdit(r)">수정</button>
                                <button type="button" class="adm-link adm-link-danger" @click="remove(r)">삭제</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div class="adm-more" v-if="hasMore">
                    <button type="button" class="adm-btn" @click="load(false)" :disabled="loading">더 보기</button>
                </div>
            </div>
        </div>

        <transition name="modal-fade">
            <div class="gd-modal-backdrop" v-if="modalOpen" @click.self="modalOpen = false">
                <div class="gd-modal">
                    <div class="gd-modal-body">
                        <h2 class="gd-modal-title">[[ form.shippingInfoNo ? '배송비 수정' : '배송비 등록' ]]</h2>

                        <div class="adm-field"><label class="adm-label" for="modal_zip_no">우편번호</label>
                            <input id="modal_zip_no" type="text" class="gd-input" v-model="form.zipNo"></div>
                        <div class="adm-field"><label class="adm-label" for="modal_addr_1">주소1</label>
                            <input id="modal_addr_1" type="text" class="gd-input" v-model="form.addr1"></div>
                        <div class="adm-field"><label class="adm-label" for="modal_addr_2">주소2</label>
                            <input id="modal_addr_2" type="text" class="gd-input" v-model="form.addr2"></div>
                        <div class="adm-field"><label class="adm-label" for="modal_addr_3">주소3</label>
                            <input id="modal_addr_3" type="text" class="gd-input" v-model="form.addr3"></div>
                        <div class="adm-field"><label class="adm-label" for="modal_including_keyword">포함키워드</label>
                            <input id="modal_including_keyword" type="text" class="gd-input" v-model="form.includingKeyword"
                                   placeholder="비우면 우편번호만으로 적용"></div>
                        <div class="adm-field"><label class="adm-label" for="modal_shipping_fee">추가배송비</label>
                            <input id="modal_shipping_fee" type="text" inputmode="numeric" class="gd-input" v-model="form.shippingFee"></div>
                    </div>
                    <div class="gd-modal-footer">
                        <button type="button" class="gd-btn" @click="modalOpen = false">닫기</button>
                        <button type="button" id="save_shipping_info" class="gd-btn gd-btn-primary"
                                @click="save" :disabled="saving">저장</button>
                    </div>
                </div>
            </div>
        </transition>

        <app-footer></app-footer>
    </div>

    <input type="hidden" id="user_no" value="{{userNo}}">
    <input type="hidden" id="admin_yn" value="{{adminYn}}">

    <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
    <script src="/static/js/common/utils.js"></script>
    <script src="/static/js/component/vue-layout.js"></script>
    <script src="/static/js/admin/delivery_manager/delivery_manager.js"></script>
</body>

</html>
