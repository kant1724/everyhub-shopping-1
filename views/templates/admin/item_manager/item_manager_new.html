<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>상품 등록</title>
    <link rel="stylesheet" href="/static/lib/fontawesome-pro/css/all.css">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
    <link href="/static/css/common/base.css" rel="stylesheet">
    <link href="/static/css/admin/admin.css" rel="stylesheet">
</head>

<body>
    <div id="item_form_app" class="adm" v-cloak>
        <app-header :user-no="userNo" :admin-yn="adminYn"></app-header>

        <div class="adm-shell adm-shell-narrow">
            <button type="button" class="adm-back" @click="goBack"><i class="far fa-angle-left"></i> 상품목록</button>

            <div class="adm-head">
                <div>
                    <h1 class="adm-title">[[ isEdit ? '상품 수정' : '상품 등록' ]]</h1>
                    <p class="adm-sub" v-if="isEdit">상품번호 [[ itemNo ]]</p>
                </div>
                <div class="adm-actions">
                    <button type="button" class="adm-btn" @click="goBack">취소</button>
                    <button type="button" class="adm-btn adm-btn-primary" id="save_item" @click="save" :disabled="saving">
                        [[ saving ? '저장 중...' : '저장' ]]
                    </button>
                </div>
            </div>

            <p v-if="loading" class="adm-empty">불러오는 중...</p>

            <template v-else>
                <section class="adm-card">
                    <h2 class="adm-card-title">기본 정보</h2>

                    <div class="adm-field">
                        <label class="adm-label" for="item_nm">상품명</label>
                        <input id="item_nm" type="text" class="gd-input" v-model="form.itemNm">
                    </div>
                    <p class="adm-error" v-if="errors.itemNm">[[ errors.itemNm ]]</p>

                    <div class="adm-field">
                        <label class="adm-label" for="item_main_ctgr_cd">대분류</label>
                        <select id="item_main_ctgr_cd" class="gd-input" v-model="form.itemMainCtgrCd">
                            <option value="">선택</option>
                            <option v-for="c in mainCtgrList" :key="c.cd" :value="c.cd">[[ c.nm ]]</option>
                        </select>
                    </div>

                    <div class="adm-field">
                        <label class="adm-label" for="item_mid_ctgr_cd">중분류</label>
                        <select id="item_mid_ctgr_cd" class="gd-input" v-model="form.itemMidCtgrCd">
                            <option value="">선택</option>
                            <option v-for="c in midCtgrList" :key="c.cd" :value="c.cd">[[ c.nm ]]</option>
                        </select>
                    </div>

                    <div class="adm-field">
                        <label class="adm-label" for="origin_cd">원산지</label>
                        <select id="origin_cd" class="gd-input" v-model="form.originCd">
                            <option v-for="c in originList" :key="c.cd" :value="c.cd">[[ c.nm ]]</option>
                        </select>
                    </div>

                    <div class="adm-field adm-field-block">
                        <label class="adm-label" for="item_desc">상품설명</label>
                        <textarea id="item_desc" class="gd-input" style="height:90px;" v-model="form.itemDesc"></textarea>
                    </div>
                    <p class="adm-hint" :class="{ 'is-over': (form.itemDesc || '').length > 100 }">
                        [[ (form.itemDesc || '').length ]] / 100자
                    </p>
                    <p class="adm-error" v-if="errors.itemDesc">[[ errors.itemDesc ]]</p>

                    <div class="adm-field adm-field-block">
                        <label class="adm-label" for="notice">공지</label>
                        <textarea id="notice" class="gd-input" style="height:70px;" v-model="form.notice"></textarea>
                    </div>

                    <div class="adm-field">
                        <label class="adm-label" for="keeping_method">보관방법</label>
                        <input id="keeping_method" type="text" class="gd-input" v-model="form.keepingMethod">
                    </div>

                    <div class="adm-field adm-field-block">
                        <label class="adm-label" for="damage_remarks">파손시 조치</label>
                        <textarea id="damage_remarks" class="gd-input" style="height:70px;" v-model="form.damageRemarks"></textarea>
                    </div>

                    <div class="adm-field">
                        <label class="adm-label" for="sort_order">정렬순서</label>
                        <input id="sort_order" type="text" inputmode="numeric" class="gd-input" v-model="form.sortOrder">
                    </div>
                </section>

                <section class="adm-card">
                    <h2 class="adm-card-title">노출 설정</h2>
                    <div class="adm-field"><span class="adm-label">추천상품</span>
                        <div class="adm-radios">
                            <label class="adm-radio"><input type="radio" value="Y" v-model="form.recommendYn"><span>예</span></label>
                            <label class="adm-radio"><input type="radio" value="N" v-model="form.recommendYn"><span>아니오</span></label>
                        </div></div>
                    <div class="adm-field"><span class="adm-label">사용여부</span>
                        <div class="adm-radios">
                            <label class="adm-radio"><input type="radio" value="Y" v-model="form.useYn"><span>사용</span></label>
                            <label class="adm-radio"><input type="radio" value="N" v-model="form.useYn"><span>미사용</span></label>
                        </div></div>
                    <div class="adm-field"><span class="adm-label">출하여부</span>
                        <div class="adm-radios">
                            <label class="adm-radio"><input type="radio" value="Y" v-model="form.shipYn"><span>판매중</span></label>
                            <label class="adm-radio"><input type="radio" value="N" v-model="form.shipYn"><span>출하전</span></label>
                        </div></div>
                    <div class="adm-field"><span class="adm-label">품절여부</span>
                        <div class="adm-radios">
                            <label class="adm-radio"><input type="radio" value="Y" v-model="form.soldOutYn"><span>품절</span></label>
                            <label class="adm-radio"><input type="radio" value="N" v-model="form.soldOutYn"><span>판매가능</span></label>
                        </div></div>
                </section>

                <section class="adm-card">
                    <h2 class="adm-card-title">상품 이미지</h2>
                    <p class="adm-note">사진을 새로 고르지 않으면 기존 사진이 그대로 유지됩니다.</p>
                    <div class="adm-images">
                        <div class="adm-image-slot" v-for="s in slots" :key="s.n">
                            <div class="adm-image-label">이미지 [[ s.n ]]</div>
                            <img v-if="shownImage(s)" :src="shownImage(s)" :alt="'이미지 ' + s.n">
                            <div v-else class="adm-image-empty"><i class="fal fa-image"></i></div>
                            <input :id="'item_image_' + s.n" type="file" accept="image/*" @change="onPick(s, $event)">
                            <button type="button" class="adm-link adm-link-danger adm-image-remove"
                                    v-if="shownImage(s)" @click="clearSlot(s)">이미지 삭제</button>
                        </div>
                    </div>
                </section>
            </template>
        </div>

        <app-footer></app-footer>
    </div>

    <input type="hidden" id="user_no" value="{{userNo}}">
    <input type="hidden" id="admin_yn" value="{{adminYn}}">

    <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
    <script src="/static/js/common/utils.js"></script>
    <script src="/static/js/component/vue-layout.js"></script>
    <script src="/static/js/admin/item_manager/item_manager_new.js"></script>
</body>

</html>
