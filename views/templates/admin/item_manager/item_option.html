<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>옵션 관리</title>
    <link rel="stylesheet" href="/static/lib/fontawesome-pro/css/all.css">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
    <link href="/static/css/common/base.css" rel="stylesheet">
    <link href="/static/css/admin/admin.css" rel="stylesheet">
</head>

<body>
    <div id="option_app" class="adm" v-cloak>
        <app-header :user-no="userNo" :admin-yn="adminYn"></app-header>

        <div class="adm-shell">
            <button type="button" class="adm-back" @click="goBack"><i class="far fa-angle-left"></i> 상품목록</button>

            <div class="adm-head">
                <div>
                    <h1 class="adm-title">옵션 관리</h1>
                    <p class="adm-sub">상품번호 [[ itemNo ]] · 옵션 [[ rows.length ]]건</p>
                </div>
                <div class="adm-actions">
                    <button type="button" class="adm-btn adm-btn-primary new-option-btn" @click="openNew">옵션 등록</button>
                </div>
            </div>

            <p v-if="loading" class="adm-empty">불러오는 중...</p>
            <p v-else-if="rows.length === 0" class="adm-empty">등록된 옵션이 없습니다.</p>

            <div v-else class="adm-table-wrap">
                <table class="adm-table option-table">
                    <thead>
                        <tr><th>옵션번호</th><th>옵션명</th><th>가격</th><th>배송비</th><th>사용</th><th>정렬</th>
                            <th class="adm-table-center">관리</th></tr>
                    </thead>
                    <tbody>
                        <tr v-for="r in rows" :key="r.optionNo">
                            <td class="option-no">[[ r.optionNo ]]</td>
                            <td class="option-nm">[[ r.optionNm ]]</td>
                            <td class="item-price">[[ won(r.itemPrice) ]]원</td>
                            <td class="shipping-fee">[[ won(r.shippingFee) ]]원</td>
                            <td><span class="adm-badge" :class="r.useYn === 'Y' ? 'is-on' : 'is-off'">[[ r.useYn ]]</span></td>
                            <td class="sort-order">[[ r.sortOrder == null ? 0 : r.sortOrder ]]</td>
                            <td class="adm-table-center">
                                <button type="button" class="adm-link" @click="openEdit(r)">변경</button>
                                <button type="button" class="adm-link adm-link-danger" @click="remove(r)">삭제</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <transition name="modal-fade">
            <div class="gd-modal-backdrop" v-if="modalOpen" @click.self="modalOpen = false">
                <div class="gd-modal">
                    <div class="gd-modal-body">
                        <h2 class="gd-modal-title">[[ form.optionNo ? '옵션 변경' : '옵션 등록' ]]</h2>
                        <div class="adm-field"><label class="adm-label" for="option_nm">옵션명</label>
                            <input id="option_nm" type="text" class="gd-input" v-model="form.optionNm"></div>
                        <div class="adm-field"><label class="adm-label" for="item_price">가격</label>
                            <input id="item_price" type="text" inputmode="numeric" class="gd-input" v-model="form.itemPrice"></div>
                        <div class="adm-field"><label class="adm-label" for="shipping_fee">배송비</label>
                            <input id="shipping_fee" type="text" inputmode="numeric" class="gd-input" v-model="form.shippingFee"></div>
                        <div class="adm-field"><span class="adm-label">사용여부</span>
                            <div class="adm-radios">
                                <label class="adm-radio"><input type="radio" value="Y" v-model="form.useYn"><span>사용</span></label>
                                <label class="adm-radio"><input type="radio" value="N" v-model="form.useYn"><span>미사용</span></label>
                            </div></div>
                        <div class="adm-field"><label class="adm-label" for="sort_order">정렬순서</label>
                            <input id="sort_order" type="text" inputmode="numeric" class="gd-input" v-model="form.sortOrder"></div>
                    </div>
                    <div class="gd-modal-footer">
                        <button type="button" class="gd-btn" @click="modalOpen = false">닫기</button>
                        <button type="button" id="save_option" class="gd-btn gd-btn-primary" @click="save" :disabled="saving">저장</button>
                    </div>
                </div>
            </div>
        </transition>

        <app-footer></app-footer>
    </div>

    <input type="hidden" id="item_no" value="{{itemNo}}">
    <input type="hidden" id="user_no" value="{{userNo}}">
    <input type="hidden" id="admin_yn" value="{{adminYn}}">

    <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
    <script src="/static/js/common/utils.js"></script>
    <script src="/static/js/component/vue-layout.js"></script>
    <script src="/static/js/admin/item_manager/item_option.js"></script>
</body>

</html>
