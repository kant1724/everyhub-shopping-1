<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>농장소개</title>
    <link rel="stylesheet" href="/static/lib/fontawesome-pro/css/all.css">
    <link href="https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
    <link href="/static/css/common/base.css" rel="stylesheet">
    <link href="/static/css/main/introduction.css" rel="stylesheet">
</head>

<body>
    <div id="intro_app" class="intro" v-cloak>
        <app-header :user-no="userNo" :admin-yn="adminYn"></app-header>

        <button type="button" class="gd-cart-fab" @click="goCart" aria-label="장바구니">
            <i class="far fa-shopping-cart"></i>
        </button>

        <div class="intro-shell">
            <h1 class="intro-title">소개의 글</h1>

            <p v-if="loading" class="intro-loading">불러오는 중...</p>
            <p v-else class="intro-text">[[ text ]]</p>

            <div class="intro-photo">
                <img src="/static/res/introduction.png" alt="간드락농원 소개">
            </div>
        </div>

        <app-footer></app-footer>
    </div>

    <input type="hidden" id="user_no" value="{{userNo}}">
    <input type="hidden" id="admin_yn" value="{{adminYn}}">

    <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
    <script src="/static/js/common/utils.js"></script>
    <script src="/static/js/component/vue-layout.js"></script>
    <script src="/static/js/main/introduction.js"></script>
</body>

</html>
