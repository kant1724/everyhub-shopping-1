<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>검색결과</title>
    <link rel="stylesheet" href="/static/lib/fontawesome-pro/css/all.css">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
    <link href="/static/css/common/base.css" rel="stylesheet">
    <link href="/static/css/main/search_result.css" rel="stylesheet">
</head>

<body>
    <div id="search_app" class="srch" v-cloak>
        <app-header :user-no="userNo" :admin-yn="adminYn"></app-header>

        <div class="srch-shell">
            <h1 class="srch-title">검색결과</h1>
            <p class="srch-sub"><strong>[[ query ]]</strong> 검색 결과 [[ items.length ]]건</p>

            <p v-if="loading" class="srch-empty">검색 중...</p>
            <p v-else-if="items.length === 0" class="srch-empty">검색 결과가 없습니다.</p>

            <div v-else class="product-grid">
                <article class="product-card" v-for="item in items" :key="item.itemNo" @click="goProduct(item.itemNo)">
                    <div class="product-card-thumb"><img :src="item.imagePath1" :alt="item.itemNm"></div>
                    <div class="product-card-body">
                        <span class="product-chip" :class="{ 'is-off': item.shipYn !== 'Y' }">[[ statusOf(item) ]]</span>
                        <h3 class="product-card-name">[[ item.itemNm ]]</h3>
                        <p class="product-card-desc">[[ descOf(item) ]]</p>
                        <p class="product-card-origin">원산지 국내산</p>
                    </div>
                </article>
            </div>
        </div>

        <app-footer></app-footer>
    </div>

    <input type="hidden" id="query" value="{{query}}">
    <input type="hidden" id="user_no" value="{{userNo}}">
    <input type="hidden" id="admin_yn" value="{{adminYn}}">

    <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
    <script src="/static/js/common/utils.js"></script>
    <script src="/static/js/component/vue-layout.js"></script>
    <script src="/static/js/main/search_result.js"></script>
</body>

</html>
