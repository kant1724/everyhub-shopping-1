<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>알림마당</title>
    <link rel="stylesheet" href="/static/lib/fontawesome-pro/css/all.css">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
    <link href="/static/css/common/base.css" rel="stylesheet">
    <link href="/static/css/board/notice/notice.css" rel="stylesheet">
</head>

<body>
    <div id="notice_app" class="nt" v-cloak>
        <app-header :user-no="userNo" :admin-yn="adminYn"></app-header>

        <div class="nt-shell">
            <div class="nt-head">
                <div>
                    <h1 class="nt-title">알림마당</h1>
                    <p class="nt-sub">농원의 소식과 안내를 확인하세요</p>
                </div>
                <button type="button" id="regist" class="nt-primary-btn" v-if="isAdmin" @click="goRegist">글쓰기</button>
            </div>

            <p v-if="loading" class="nt-empty">불러오는 중...</p>
            <p v-else-if="notices.length === 0" class="nt-empty">등록된 공지가 없습니다.</p>

            <ul v-else class="nt-list">
                <li v-for="n in notices" :key="n.noticeNo" class="nt-row" @click="openDetail(n)">
                    <span class="nt-row-no">[[ n.noticeNo ]]</span>
                    <span class="nt-row-title">[[ n.noticeTitle ]]</span>
                    <span class="nt-row-date">[[ n.noticeDate ]]</span>
                    <button type="button" class="nt-row-edit" v-if="isAdmin" @click.stop="editNotice(n)">수정</button>
                </li>
            </ul>
        </div>

        <app-footer></app-footer>
    </div>

    <input type="hidden" id="user_no" value="{{userNo}}">
    <input type="hidden" id="admin_yn" value="{{adminYn}}">

    <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
    <script src="/static/js/common/utils.js"></script>
    <script src="/static/js/component/vue-layout.js"></script>
    <script src="/static/js/board/notice/notice_list.js"></script>
</body>

</html>
