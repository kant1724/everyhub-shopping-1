<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>공지 등록</title>
    <link rel="stylesheet" href="/static/lib/fontawesome-pro/css/all.css">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
    <link href="/static/css/common/base.css" rel="stylesheet">
    <link href="/static/css/board/notice/notice.css" rel="stylesheet">
</head>

<body>
    <div id="notice_editor_app" class="nt" v-cloak>
        <app-header :user-no="userNo" :admin-yn="adminYn"></app-header>

        <div class="nt-shell nt-shell-narrow">
            <button type="button" class="nt-back" @click="goList">
                <i class="far fa-angle-left"></i> 목록으로
            </button>

            <h1 class="nt-title">[[ isEdit ? '공지 수정' : '공지 등록' ]]</h1>

            <section class="nt-card">
                <label class="nt-label" for="notice_title">제목</label>
                <input id="notice_title" type="text" class="gd-input" v-model="form.noticeTitle" placeholder="제목을 입력하세요">

                <label class="nt-label nt-label-mt" for="notice_content">내용</label>
                <textarea id="notice_content" class="gd-input nt-textarea" v-model="form.noticeContent"
                          placeholder="내용을 입력하세요"></textarea>

                <div class="nt-actions">
                    <button type="button" class="nt-ghost-btn" @click="goList">취소</button>
                    <button type="button" id="save_notice_btn" class="nt-primary-btn" @click="save" :disabled="submitting">
                        [[ submitting ? '저장 중...' : '저장' ]]
                    </button>
                </div>
            </section>
        </div>

        <app-footer></app-footer>
    </div>

    <input type="hidden" id="user_no" value="{{userNo}}">
    <input type="hidden" id="admin_yn" value="{{adminYn}}">

    <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
    <script src="/static/js/common/utils.js"></script>
    <script src="/static/js/component/vue-layout.js"></script>
    <script src="/static/js/board/notice/notice_regist.js"></script>
</body>

</html>
